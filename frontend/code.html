<script>
// ── Quip News Feed ──────────────────────────────────────────────────────────
const QUIP_API = 'http://localhost:8000';

const GRADIENTS = [
  'from-tertiary-container/30 to-primary-container/10',
  'from-secondary-container/20 to-tertiary-container/20',
  'from-outline/20 to-primary-container/20',
  'from-primary-container/20 to-secondary-container/20',
  'from-tertiary-container/20 to-outline/10',
  'from-secondary-container/30 to-primary-container/20',
];

function esc(str) {
  const d = document.createElement('div');
  d.appendChild(document.createTextNode(str || ''));
  return d.innerHTML;
}

function sentimentBadge(sentiment, score) {
  const map = {
    positive: { cls: 'text-emerald-600 bg-emerald-50 border-emerald-200', label: '▲ Positive' },
    negative: { cls: 'text-red-500 bg-red-50 border-red-200',             label: '▼ Negative' },
    neutral:  { cls: 'text-stone-400 bg-stone-50 border-stone-200',        label: '● Neutral'  },
  };
  const s = map[sentiment] || map.neutral;
  const pct = score ? ` ${Math.round(score * 100)}%` : '';
  return `<span class="font-label-caps text-label-caps border px-2 py-0.5 rounded-full text-[10px] ${s.cls}">${s.label}${pct}</span>`;
}

function renderCard(article, idx) {
  const grad = GRADIENTS[idx % GRADIENTS.length];
  const imageHtml = article.image_url
    ? `<img alt="${esc(article.title)}" class="w-full h-full object-cover opacity-80 mix-blend-multiply group-hover:scale-105 transition-transform duration-500"
          src="${esc(article.image_url)}" onerror="this.style.display='none'">`
    : '';
  const tickers = (article.tickers || []).slice(0, 3)
    .map(t => `<span class="text-[10px] font-mono bg-primary-container/20 text-on-primary-fixed px-1.5 py-0.5 rounded">${esc(t)}</span>`)
    .join(' ');

  return `
<article
  class="bg-white rounded-lg p-6 shadow-sm hover:shadow-md transition-shadow duration-300 flex flex-col gap-4 border border-outline/10 relative overflow-hidden group cursor-pointer"
  onclick="window.open('${esc(article.url)}', '_blank', 'noopener')">
  <div class="w-full h-48 bg-gradient-to-br ${grad} rounded-DEFAULT mb-2 overflow-hidden">
    ${imageHtml}
  </div>
  <div class="flex items-center justify-between flex-wrap gap-1">
    <span class="font-label-caps text-label-caps text-primary-container">${esc(article.published_at_formatted)}</span>
    ${sentimentBadge(article.sentiment, article.sentiment_score)}
  </div>
  <h2 class="font-headline-sm text-headline-sm text-[#1a2318] leading-snug line-clamp-2">${esc(article.title)}</h2>
  <p class="font-body-md text-body-md text-outline-variant flex-grow line-clamp-3">${esc(article.description)}</p>
  <div class="flex items-end justify-between mt-2">
    <div class="w-12 h-1 bg-primary-container"></div>
    <div class="flex items-center gap-1 flex-wrap justify-end">
      ${tickers}
      <span class="text-[10px] text-outline">${esc(article.source)}</span>
    </div>
  </div>
</article>`;
}

function renderSkeleton() {
  return Array.from({ length: 6 }, () => `
<article class="bg-white rounded-lg p-6 border border-outline/10 flex flex-col gap-4 animate-pulse">
  <div class="w-full h-48 bg-stone-100 rounded-DEFAULT mb-2"></div>
  <div class="h-3 bg-stone-100 rounded w-1/3"></div>
  <div class="h-5 bg-stone-100 rounded w-full"></div>
  <div class="h-5 bg-stone-100 rounded w-4/5"></div>
  <div class="h-3 bg-stone-100 rounded w-full"></div>
  <div class="h-3 bg-stone-100 rounded w-3/4"></div>
</article>`).join('');
}

async function loadNews(period = '24h', query = '') {
  const grid = document.getElementById('news-grid');
  grid.innerHTML = renderSkeleton();

  try {
    const params = new URLSearchParams({ period, query, limit: 6 });
    const res = await fetch(`${QUIP_API}/news?${params}`, { signal: AbortSignal.timeout(12000) });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();

    if (!data.articles || data.articles.length === 0) {
      grid.innerHTML = `<div class="col-span-3 text-center text-outline py-16">No articles found.</div>`;
      return;
    }
    grid.innerHTML = data.articles.map((a, i) => renderCard(a, i)).join('');
  } catch (err) {
    console.warn('Quip /news unavailable, showing fallback', err);
    grid.innerHTML = getFallbackCards();
  }
}

function getFallbackCards() {
  const items = [
    { date: 'MAY 01, 2025', title: 'Markets await Fed rate decision amid mixed economic signals', desc: 'Equity futures edged lower as investors positioned ahead of this week\'s FOMC meeting, with inflation data showing persistent stickiness in the services sector.' },
    { date: 'APR 30, 2025', title: 'Tech earnings beat expectations as AI spending accelerates', desc: 'Mega-cap technology companies reported stronger-than-expected quarterly results, with capital expenditure guidance raised significantly on AI infrastructure buildout.' },
    { date: 'APR 29, 2025', title: 'Energy sector rallies on supply disruption concerns', desc: 'Crude oil prices climbed following reports of unexpected production cuts, pushing energy stocks to multi-month highs and reshaping sector rotation dynamics.' },
  ];
  return items.map((item, i) => `
<article class="bg-white rounded-lg p-6 shadow-sm hover:shadow-md transition-shadow duration-300 flex flex-col gap-4 border border-outline/10 relative overflow-hidden group">
  <div class="w-full h-48 bg-gradient-to-br ${GRADIENTS[i]} rounded-DEFAULT mb-2"></div>
  <span class="font-label-caps text-label-caps text-primary-container">${item.date}</span>
  <h2 class="font-headline-sm text-headline-sm text-[#1a2318] leading-snug">${item.title}</h2>
  <p class="font-body-md text-body-md text-outline-variant flex-grow line-clamp-3">${item.desc}</p>
  <div class="w-12 h-1 bg-primary-container mt-4"></div>
</article>`).join('');
}

// ── Search & filter wiring ──────────────────────────────────────────────────
let _searchTimer;

// ── Greeting based on time of day ──────────────────────────────────────────
function setGreeting() {
  const hour = new Date().getHours();
  let greeting, sub;
  if (hour < 12) {
    greeting = 'Good Morning';
    sub = 'What would you like to analyse today?';
  } else if (hour < 17) {
    greeting = 'Good Afternoon';
    sub = 'Markets are open. Let\'s dig in.';
  } else {
    greeting = 'Good Evening';
    sub = 'Catching up on today\'s market moves?';
  }
  const h = document.getElementById('greeting-heading');
  const p = document.getElementById('greeting-sub');
  if (h) h.textContent = greeting;
  if (p) p.textContent = sub;
}

// ── Ticker extraction ───────────────────────────────────────────────────────
function extractTicker(text) {
  // Matches: "analyze NVDA", "what about AAPL", "TSLA outlook", bare uppercase 1-5 chars
  const explicit = text.match(/(?:analyze|analyse|what(?:'s| is| about)?|tell me about|thoughts on)\s+([A-Z]{1,5})\b/i);
  if (explicit) return explicit[1].toUpperCase();
  // Fallback: lone all-caps word 1–5 chars
  const bare = text.match(/\b([A-Z]{2,5})\b/);
  if (bare) return bare[1].toUpperCase();
  return null;
}

// ── Signal colour helpers ───────────────────────────────────────────────────
function signalColour(signal) {
  if (!signal) return 'text-stone-400';
  const s = signal.toUpperCase();
  if (s === 'BUY')  return 'text-emerald-600';
  if (s === 'SELL') return 'text-red-500';
  return 'text-amber-500';
}

function sentimentColour(label) {
  if (!label) return 'text-stone-400';
  const l = label.toLowerCase();
  if (l === 'positive') return 'text-emerald-600';
  if (l === 'negative') return 'text-red-500';
  return 'text-amber-500';
}

// ── Render analysis result ──────────────────────────────────────────────────
function renderAnalysis(data) {
  const box = document.getElementById('analysis-result');
  if (!box) return;

  if (data.error && !data.reasoning) {
    box.className = box.className.replace('hidden', '') + ' ';
    box.classList.remove('hidden');
    box.innerHTML = `<div class="rounded-xl border border-red-500/30 bg-red-950/20 px-5 py-4 text-red-400 font-body-md text-body-md">${esc(data.error)}</div>`;
    return;
  }

  const signalCls  = signalColour(data.signal);
  const sentCls    = sentimentColour(data.sentiment_label);
  const probPct    = data.probability != null ? `${data.probability}%` : '—';
  const sentPct    = data.sentiment_score != null ? `${data.sentiment_score}%` : '—';
  const signalTxt  = data.signal ? data.signal.toUpperCase() : '—';
  const sentLbl    = data.sentiment_label ? data.sentiment_label.charAt(0).toUpperCase() + data.sentiment_label.slice(1) : '—';
  const tickerBadge = data.ticker ? `<span class="font-mono bg-primary-container/20 text-on-primary-fixed px-2 py-0.5 rounded text-[11px] mr-2">${esc(data.ticker)}</span>` : '';

  const conflictBanner = data.conflict_detected ? `
  <div class="mt-3 flex items-center gap-2 rounded-lg border border-amber-500/40 bg-amber-950/20 px-4 py-2 text-amber-400 font-label-caps text-label-caps">
    <span class="material-symbols-outlined text-[16px]">warning</span>
    Conflicting signals detected — exercise caution
  </div>` : '';

  const errorNote = data.error ? `<p class="mt-2 text-amber-400 font-label-caps text-label-caps">${esc(data.error)}</p>` : '';

  box.classList.remove('hidden');
  box.innerHTML = `
<div class="rounded-xl border border-outline/20 bg-surface-container-high/60 backdrop-blur-md px-5 py-5 flex flex-col gap-3 shadow-lg">
  <div class="flex items-center gap-2 flex-wrap">
    ${tickerBadge}
    <span class="font-headline-sm text-headline-sm ${signalCls} font-bold">${signalTxt}</span>
    <span class="text-on-surface-variant font-body-md text-body-md">${probPct}</span>
  </div>
  <p class="font-body-md text-body-md text-on-surface leading-relaxed">${esc(data.reasoning || '')}</p>
  <div class="flex items-center gap-4 flex-wrap font-label-caps text-label-caps text-on-surface-variant border-t border-outline/10 pt-3">
    <span>Sentiment: <span class="${sentCls} font-semibold">${sentLbl}</span></span>
    <span>Confidence: <span class="text-on-surface font-semibold">${sentPct}</span></span>
  </div>
  ${conflictBanner}
  ${errorNote}
</div>`;
}

// ── Chat send handler ───────────────────────────────────────────────────────
async function sendChat() {
  const input  = document.getElementById('chat-input');
  const sendBtn = document.getElementById('chat-send');
  const sendIcon = document.getElementById('chat-send-icon');
  const resultBox = document.getElementById('analysis-result');
  if (!input || !sendBtn) return;

  const rawText = input.value.trim();
  if (!rawText) return;

  const ticker = extractTicker(rawText);

  // Spinner on
  sendBtn.disabled = true;
  sendBtn.classList.add('opacity-60', 'cursor-not-allowed');
  if (sendIcon) sendIcon.textContent = 'progress_activity';
  if (resultBox) resultBox.classList.add('hidden');

  try {
    const payload = {
      ticker: ticker || null,
      query: rawText,
      include_news: true,
      include_fundamentals: true,
    };
    const res = await fetch(`${QUIP_API}/api/v1/analyze`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
      signal: AbortSignal.timeout(60000),
    });
    const data = await res.json();
    renderAnalysis(data);
  } catch (err) {
    renderAnalysis({ error: `Request failed: ${err.message}` });
  } finally {
    // Spinner off
    sendBtn.disabled = false;
    sendBtn.classList.remove('opacity-60', 'cursor-not-allowed');
    if (sendIcon) sendIcon.textContent = 'arrow_upward';
  }
}

document.addEventListener('DOMContentLoaded', () => {
  setGreeting();
  loadNews();

  // Chat send on button click
  const sendBtn = document.getElementById('chat-send');
  if (sendBtn) sendBtn.addEventListener('click', sendChat);

  // Chat send on Ctrl+Enter / Cmd+Enter
  const input = document.getElementById('chat-input');
  if (input) {
    input.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        e.preventDefault();
        sendChat();
      }
    });
  }

  const searchInput = document.querySelector('input[placeholder*="Search markets"]');
  const periodSelect = document.querySelector('select');

  if (searchInput) {
    searchInput.addEventListener('input', (e) => {
      clearTimeout(_searchTimer);
      _searchTimer = setTimeout(() => {
        const period = periodSelect ? _periodValue(periodSelect.value) : '24h';
        loadNews(period, e.target.value.trim());
      }, 500);
    });
  }

  if (periodSelect) {
    periodSelect.addEventListener('change', (e) => {
      const q = searchInput ? searchInput.value.trim() : '';
      loadNews(_periodValue(e.target.value), q);
    });
  }
});

function _periodValue(label) {
  const map = { 'Past 24 Hours': '24h', 'Past Week': 'week', 'Past Month': 'month' };
  return map[label] || '24h';
}
</script>
</body></html>
